
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Extract project
        run: unzip -q HeadshotProMobile.zip

      - name: Build APK
        run: gradle -p HeadshotProMobile assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Mikael-Cheat-APK
          path: HeadshotProMobile/app/build/outputs/apk/release/*.apk
